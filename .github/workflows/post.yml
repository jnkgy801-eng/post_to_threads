name: Rakuten to Threads Auto Post

on:
  schedule:
    # JST 12:07 / 19:21 / 21:38 / 22:12 = UTC 3:07 / 10:21 / 12:38 / 13:12
    # cronの起動自体をきっちり0分にしないことに加え、スクリプト内でも
    # ランダムなジッターを入れて実際の投稿時刻をさらにずらしている
    - cron: "7 3 * * *"
    - cron: "21 10 * * *"
    - cron: "38 12 * * *"
    - cron: "12 13 * * *"
  workflow_dispatch:
    inputs:
      jitter_max_seconds:
        description: "手動実行時のジッター最大秒数(即実行したい場合は0)"
        required: false
        default: "0"
      keyword:
        description: "手動実行時に検索するキーワード(空欄ならRAKUTEN_KEYWORDSからランダム選択、それも空ならジャンルランキング)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    # ジッター(最大15分)を含めても余裕を持てるようタイムアウトを設定
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Post to Threads
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_GENRE_ID: ${{ secrets.RAKUTEN_GENRE_ID || '0' }}
          # 手動実行(workflow_dispatch)時はinputのkeywordを最優先で使う。
          # スケジュール実行(自動実行)時はここは空になり、スクリプト側が
          # RAKUTEN_KEYWORDSの中からランダムに1つを自動選択する。
          RAKUTEN_KEYWORD: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.keyword || '' }}
          # 自動実行時に選択候補とするキーワード一覧(カンマ区切り)。
          # 例: "扇風機,加湿器,掃除機,洗剤,モバイルバッテリー"
          # リポジトリの Settings > Secrets and variables > Actions で設定する。
          # 未設定(空)の場合は、従来どおりジャンル総合ランキング(RAKUTEN_GENRE_ID)から投稿する。
          RAKUTEN_KEYWORDS: ${{ secrets.RAKUTEN_KEYWORDS }}
          # Google AI Studioで発行した無料枠のGemini APIキー。
          # 未設定の場合は自動的に固定テンプレートでの投稿文生成にフォールバックする。
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          # スケジュール実行は最大900秒(15分)ゆらす。手動実行(workflow_dispatch)は
          # 入力値を使う(デフォルト0=即実行)。
          JITTER_MAX_SECONDS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.jitter_max_seconds || '900' }}
        run: python scripts/post_to_threads.py

      - name: Commit posted items log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --staged --quiet || git commit -m "chore: update posted items log"
          git push
