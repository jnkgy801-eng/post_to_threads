name: Schedule Rakuten posts to Buffer (Threads)

on:
  schedule:
    # JST 06:00 = UTC 21:00(前日)。1日1回、直近48時間ぶんの空き枠だけをBufferに予約する。
    # 投稿時刻そのものは scripts/schedule_to_buffer.py の POST_SLOTS_JST で決まり、
    # このcronの時刻や、GitHub側の起動遅延には依存しない。
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: Bufferに送らず内容だけ確認 / false: 実際に予約する"
        type: boolean
        default: true
      keyword:
        description: "検索キーワードを固定したい場合のみ入力(空欄なら自動選定)"
        required: false
        default: ""

permissions:
  contents: write

# 同時実行すると同じ枠に二重予約・posted.jsonのpush競合が起きるため直列化する
concurrency:
  group: buffer-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Schedule posts to Buffer
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Threadsチャンネルが複数ある場合のみ設定(任意)
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          # 任意: 空なら内蔵の「季節 + 定番」キーワードプールを使う
          RAKUTEN_KEYWORDS: ${{ secrets.RAKUTEN_KEYWORDS }}
          RAKUTEN_KEYWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.keyword || '' }}
          # スケジュール実行は常に本番(false)。手動実行はinputの値(既定true=ドライラン)
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          # 投稿時刻(JST)を変えたい場合は、ここのコメントを外して編集する
          # POST_SLOTS_JST: "07:45,12:10,18:45,21:45"
        run: python scripts/schedule_to_buffer.py

      # 失敗した回でも、成功分の posted.json は必ず保存する(次回の重複投稿防止)
      - name: Commit posted items log
        if: always() && env.DRY_RUN != 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted.json
          git diff --staged --quiet || git commit -m "chore: update posted items log"
          git push
