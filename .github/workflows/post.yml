name: Schedule Rakuten posts to Buffer (Threads)

on:
  schedule:
    # JST 06:00 = UTC 21:00(前日)。1日1回、直近48時間ぶんの空き枠だけをBufferに予約する。
    # 投稿時刻そのものは scripts/schedule_to_buffer.py の POST_SLOTS_JST で決まり、
    # このcronの時刻や、GitHub側の起動遅延には依存しない。
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true: Bufferに送らず内容だけ確認 / false: 実際に予約する"
        type: boolean
        default: true
      keyword:
        description: "検索キーワードを固定したい場合のみ入力(空欄なら自動選定)"
        required: false
        default: ""

permissions:
  contents: write

# 同時実行すると同じ枠に二重予約・posted.jsonのpush競合が起きるため直列化する
concurrency:
  group: buffer-schedule
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Schedule posts to Buffer
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          # Threadsチャンネルが複数ある場合のみ設定(任意)
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          # 任意: 空なら内蔵の「季節 + 日用消耗品」キーワードプールを使う(推奨)。
          # 設定すると全商品が category=general 扱いになり、カテゴリ別の学習が効かなくなる
          RAKUTEN_KEYWORDS: ${{ secrets.RAKUTEN_KEYWORDS }}
          RAKUTEN_KEYWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.keyword || '' }}
          # スケジュール実行は常に本番(false)。手動実行はinputの値(既定true=ドライラン)
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          # --- 任意の調整(変えたい場合のみコメントを外す) ---
          # 平日の商品投稿 / 質問のみ投稿の時刻(JST)。1日5投稿(朝1・昼1・夕1・夜2)。none で無効化
          # POST_SLOTS_JST: "12:10,18:00,20:15"
          # ENGAGE_SLOTS_JST: "07:45,22:15"
          # 土日祝(休日は 9-10時・15-16時、以降は平日と同様)
          # POST_SLOTS_WEEKEND_JST: "15:30,18:00,20:15"
          # ENGAGE_SLOTS_WEEKEND_JST: "09:30,22:15"
          # 祝日として扱う日(土日用の枠を使う)
          HOLIDAYS_JST: "2026-11-23"
          # セール期間(自分で公式ページを確認して日付を入れる)。開始2日前〜終了日にセール向け投稿になる
          # SALE_EVENTS: "2026-12-04..2026-12-11:楽天スーパーSALE"
          # 商品画像を本文に添付(false で無効)/ 最大枚数
          # ATTACH_IMAGES: "true"
          # MAX_IMAGES: "3"
          # 本文の型。problem: 悩み→商品で解決できそう(既定) / question: 質問型(従来) / mixed: 半々(効果比較用)
          # POST_STYLE: "problem"
          # 扱うジャンル。増やすほどアカウントのテーマが散るので、まずは暮らし系に絞るのを推奨
          # NICHES: "daily,seasonal,home"   # 既定。他: storage,clean,beauty,gadget,food
          # 分析結果(data/feedback.json)を投稿選定に使うか。既定は使う(データ不足の間は自動で完全ランダム)
          # USE_FEEDBACK: "false"   # 使わない場合のみ
        run: python scripts/schedule_to_buffer.py

      # 失敗した回でも、成功分の posted.json は必ず保存する(次回の重複投稿防止)
      - name: Commit posted items log
        if: always() && env.DRY_RUN != 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "chore: update posted items log"
          git push
